# Serves the frozen site (single-page app: unknown paths get index.html). Runs behind a TLS-terminating proxy, so redirects stay relative.
# No access log.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    access_log off;
    absolute_redirect off;
    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml text/plain;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
