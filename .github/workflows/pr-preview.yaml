name: PR preview

# Builds the app image for every PR (the build is the CI check: `preview / build`) and, for PRs from this repository,
# runs it at https://breadstone-pr-<N>.dev.indietasten.net; removed when the PR is closed (shared preview.yml of
# InDieTasten/.github).
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  packages: write
  id-token: write
  pull-requests: write
  deployments: write

jobs:
  preview:
    uses: InDieTasten/.github/.github/workflows/preview.yml@main
    with:
      image: breadstone
