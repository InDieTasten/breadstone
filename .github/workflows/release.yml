name: Release

# master -> ghcr.io/indietasten/breadstone:sha-<short> and :edge, then the lab redeploys the breadstone stack at
# https://breadstone.indietasten.net; this run fails if it doesn't come up healthy (shared image.yml of
# InDieTasten/.github).
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  image:
    uses: InDieTasten/.github/.github/workflows/image.yml@main
    with:
      image: breadstone
      stack: breadstone
      url: https://breadstone.indietasten.net
