name: PR preview cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  id-token: write
  pull-requests: write
  deployments: write

env:
  NAME: breadstone-pr-${{ github.event.pull_request.number }}

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Remove preview
        run: |
          tok=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://preview.indietasten.net" | jq -r .value)
          curl -fsS --retry 3 -X DELETE -H "Authorization: Bearer $tok" "https://preview.indietasten.net/envs/$NAME"

      - name: Deactivate deployments and comment
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const { owner, repo } = context.repo;
            const deployments = await github.rest.repos.listDeployments({ owner, repo, environment: `pr-preview-${pr}` });
            for (const d of deployments.data) {
              await github.rest.repos.createDeploymentStatus({
                owner, repo, deployment_id: d.id, state: 'inactive', description: 'Preview removed, PR closed',
              });
            }
            await github.rest.issues.createComment({
              owner, repo, issue_number: pr, body: '## 🧹 Preview Cleanup\n\nThe preview environment has been removed.',
            });
